# Builds the samples and runs ./test.sh on every target CI can run:
# Linux x64 and arm64, Android arm64 (in a container), macOS on Apple Silicon,
# the iOS simulator, Windows x64 (under Wine),
# WebAssembly, and UEFI x64 and arm64 (in QEMU, on OVMF). DOS isn't here: it runs under an emulated 386 for 15 minutes
# and more, so run ./test.sh --dos locally. The GPU's kernels are checked up to
# Metal (./test.sh --gpu-air) and to CUDA's ptxas (./build.sh --cuda), not run:
# run ./test.sh --gpu on a Mac.
#
# bflat comes from the fork (see README, "Getting bflat"). It has no release to
# download, so the first job builds its layouts from source when the fork's
# master has moved, and caches them; every other job restores that cache.
name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read # the fork's build restores packages from GitHub Packages

# A newer push to a pull request cancels the run for the older one; runs on
# master and on tags always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bflat:
    runs-on: ubuntu-22.04
    outputs:
      key: ${{ steps.fork.outputs.key }}
    steps:
      - name: Find the fork's current commit
        id: fork
        run: echo "key=bflat-layouts-$(git ls-remote https://github.com/OnurGumus/bflat refs/heads/master | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore bflat from the cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            bflat/layouts/linux-glibc-x64
            bflat/layouts/linux-glibc-arm64
          key: ${{ steps.fork.outputs.key }}
          lookup-only: true

      - name: Check out the fork
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: OnurGumus/bflat
          ref: master
          path: bflat

      - name: Set up .NET
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build bflat
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: bflat
        env:
          PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd src/bflat
          dotnet nuget add source --username USERNAME --password "$PACKAGES_TOKEN" --store-password-in-clear-text \
            --name github "https://nuget.pkg.github.com/bflattened/index.json"
          cd ../..
          dotnet build src/bflat/bflat.csproj -t:BuildLayouts -c:Release

      - name: Save bflat to the cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            bflat/layouts/linux-glibc-x64
            bflat/layouts/linux-glibc-arm64
          key: ${{ steps.fork.outputs.key }}

  linux:
    needs: bflat
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: zero-csharp
      - uses: actions/cache/restore@v4
        with:
          path: |
            bflat/layouts/linux-glibc-x64
            bflat/layouts/linux-glibc-arm64
          key: ${{ needs.bflat.outputs.key }}
          fail-on-cache-miss: true
      - name: Install what bflat and the build need
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils
      - name: Test
        working-directory: zero-csharp
        env:
          BFLAT_DIR: ${{ github.workspace }}/bflat/layouts/linux-glibc-${{ matrix.arch }}
        run: ./test.sh
      # Android programs are arm64 Linux programs linked against Android's C
      # library: in a container with Android's loader and C library
      # (android/sysroot), they run here without an emulator.
      - name: Build and test for Android, in a container
        if: matrix.arch == 'arm64'
        working-directory: zero-csharp
        env:
          BFLAT_DIR: ${{ github.workspace }}/bflat/layouts/linux-glibc-${{ matrix.arch }}
          ANDROID_RUN: container
        run: |
          sudo apt-get install -y --no-install-recommends clang
          ./test.sh --android

  windows:
    needs: bflat
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: zero-csharp
      - uses: actions/cache/restore@v4
        with:
          path: |
            bflat/layouts/linux-glibc-x64
            bflat/layouts/linux-glibc-arm64
          key: ${{ needs.bflat.outputs.key }}
          fail-on-cache-miss: true
      - name: Install what bflat and the build need
        # clang compiles win/*.c and the assembly for Windows.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils clang
      - name: Test under Wine
        working-directory: zero-csharp
        env:
          BFLAT_DIR: ${{ github.workspace }}/bflat/layouts/linux-glibc-x64
        run: ./test.sh --win
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win-programs
          path: zero-csharp/bin/win/*.exe

  # The programs the windows job built and ran under Wine, run on Windows itself:
  # the ones whose Windows code is this repository's own (files, directories,
  # streams, sockets over Winsock, fibers), where Wine can behave differently
  # (it doesn't reset a connection closed with linger 0, for one).
  windows-native:
    needs: windows
    if: always()
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: win-programs
          path: bin/win
      # Page heap: Windows' strict heap checking, which gives each block
      # pages of its own and takes freed ones away, so a write after free
      # or past the end stops the program every time, not only when the
      # heap's layout happens to show it (as Fibers' scratch arena did).
      - name: Check every heap access
        shell: pwsh
        run: |
          $gflags = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers' -Recurse -Filter gflags.exe |
            Where-Object FullName -like '*x64*' | Select-Object -First 1
          if (-not $gflags) { throw 'gflags.exe not found' }
          Get-ChildItem bin/win -Filter *.exe | ForEach-Object { & $gflags.FullName /p /enable $_.Name /full | Out-Null }
      - name: Run on Windows
        shell: bash
        run: |
          failed=0
          for name in Files Paths Directories Streams Network Fibers Tasks Crypto CryptoErrors CryptoRandom Certificates; do
            # Not `out=$(...); status=$?`: under bash -e a failing program
            # would end the loop there, before its output is shown.
            status=0
            out=$(./bin/win/$name.exe < /dev/null 2>&1) || status=$?
            out=${out//$'\r'/}
            if [ "$status" != 0 ]; then
              echo "FAIL $name: exit code $status"
              echo "$out" | tail -8 | sed 's/^/       /'
              failed=1
            elif [ -f "tests/expected/$name.txt" ] && [ "$out" != "$(tr -d '\r' < "tests/expected/$name.txt")" ]; then
              echo "FAIL $name: output differs from tests/expected/$name.txt"
              diff <(echo "$out") <(tr -d '\r' < "tests/expected/$name.txt") | head -10 | sed 's/^/       /'
              failed=1
            else
              echo "ok   $name"
            fi
          done
          exit $failed

  uefi:
    needs: bflat
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            qemu: qemu-system-x86 ovmf
          - arch: arm64
            runner: ubuntu-24.04-arm
            qemu: qemu-system-arm qemu-efi-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: zero-csharp
      - uses: actions/cache/restore@v4
        with:
          path: |
            bflat/layouts/linux-glibc-x64
            bflat/layouts/linux-glibc-arm64
          key: ${{ needs.bflat.outputs.key }}
          fail-on-cache-miss: true
      - name: Install what bflat, the build and QEMU need
        # clang compiles efi/*.c for UEFI; OVMF is the UEFI firmware.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils clang ${{ matrix.qemu }}
      - name: Let QEMU use KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          fi
      - name: Test in QEMU
        working-directory: zero-csharp
        env:
          BFLAT_DIR: ${{ github.workspace }}/bflat/layouts/linux-glibc-${{ matrix.arch }}
          BFLAT_ARCH: ${{ matrix.arch }}
        run: ./test.sh --uefi

  # macOS runners have no Docker to run bflat in, so bflat compiles the
  # samples to Mach-O object files here, and the macos job links and runs them.
  mac-objects:
    needs: bflat
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: zero-csharp
      - uses: actions/cache/restore@v4
        with:
          path: |
            bflat/layouts/linux-glibc-x64
            bflat/layouts/linux-glibc-arm64
          key: ${{ needs.bflat.outputs.key }}
          fail-on-cache-miss: true
      - name: Compile for macOS
        working-directory: zero-csharp
        env:
          BFLAT_DIR: ${{ github.workspace }}/bflat/layouts/linux-glibc-x64
        run: |
          source ./env.sh
          # The lists span several lines each, one sample per line.
          eval "$(awk '/^(SMALL_SAMPLES|ALL_SAMPLES)=\(/,/\)$/' build.sh)"
          ./build.sh --native-mac-objects "${ALL_SAMPLES[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-objects
          path: zero-csharp/bin/mac/obj

  macos:
    needs: mac-objects
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mac-objects
          path: bin/mac/obj
      - name: Link and test
        env:
          MAC_OBJECTS_PREBUILT: '1'
        run: ./test.sh --mac
      # The same objects, linked for the iOS simulator and run in it (the
      # runner's Xcode has simulators; the first run boots an iPhone). The
      # objects are retagged by zero-bitcode, which needs .NET 10.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Link and test for the iOS simulator
        env:
          MAC_OBJECTS_PREBUILT: '1'
        run: ./test.sh --ios

  wasm:
    needs: bflat
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: zero-csharp
      - uses: actions/cache/restore@v4
        with:
          path: |
            bflat/layouts/linux-glibc-x64
            bflat/layouts/linux-glibc-arm64
          key: ${{ needs.bflat.outputs.key }}
          fail-on-cache-miss: true
      - name: Restore the WebAssembly tools
        id: wasm-tools
        uses: actions/cache@v4
        with:
          path: zero-csharp/tools/wasm
          key: wasm-tools-${{ hashFiles('zero-csharp/env.sh') }}
      - name: Install what bflat and the build need
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils
      - name: Download the WebAssembly tools
        if: steps.wasm-tools.outputs.cache-hit != 'true'
        working-directory: zero-csharp
        env:
          BFLAT_DIR: ${{ github.workspace }}/bflat/layouts/linux-glibc-x64
        run: ./setup.sh --wasm
      - name: Test
        working-directory: zero-csharp
        env:
          BFLAT_DIR: ${{ github.workspace }}/bflat/layouts/linux-glibc-x64
        run: ./test.sh --wasm
      # The GPU kernels go through the same bitcode. No runner here has Metal
      # (GitHub's Macs have no Docker for NativeAOT-LLVM either), so this
      # checks everything before it: every kernel of samples/Gpu.cs must still
      # become AIR. ./test.sh --gpu, on a Mac, compiles and runs them.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test the GPU kernels up to AIR
        working-directory: zero-csharp
        env:
          BFLAT_DIR: ${{ github.workspace }}/bflat/layouts/linux-glibc-x64
        run: ./test.sh --gpu-air
      # The same kernels for NVIDIA's GPUs (experimental): PTX from LLVM's
      # NVPTX backend, assembled by NVIDIA's ptxas (pip's nvidia-cuda-nvcc-cu12,
      # no GPU needed), and the Linux program that runs them through the CUDA
      # driver, built. No runner here has an NVIDIA GPU to run it.
      - name: Build the GPU kernels for CUDA (PTX checked by ptxas)
        working-directory: zero-csharp
        env:
          BFLAT_DIR: ${{ github.workspace }}/bflat/layouts/linux-glibc-x64
        run: |
          # This job is on Ubuntu 22.04, whose newest LLVM is 15; its llc reads
          # the kernels' IR.
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-15
          pip install --quiet nvidia-cuda-nvcc-cu12
          nvcc_dir=$(python3 -c 'import nvidia.cuda_nvcc as m; print(m.__path__[0])')
          export PATH="/usr/lib/llvm-15/bin:$nvcc_dir/bin:$PATH"
          ./build.sh --cuda

  # The Commodore 64: llvm-mos (x64 Linux build) and VICE from Ubuntu, with the
  # ROMs ./setup.sh --c64 fetches from VICE's source release. VICE has no mode
  # without a window, so it gets a virtual screen (xvfb-run).
  c64:
    needs: bflat
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: zero-csharp
      - uses: actions/cache/restore@v4
        with:
          path: |
            bflat/layouts/linux-glibc-x64
            bflat/layouts/linux-glibc-arm64
          key: ${{ needs.bflat.outputs.key }}
          fail-on-cache-miss: true
      - name: Restore the C64 tools
        uses: actions/cache@v4
        with:
          path: |
            zero-csharp/tools/c64
            zero-csharp/tools/wasm
          key: c64-tools-${{ hashFiles('zero-csharp/env.sh') }}
      - name: Install VICE, a virtual screen, and what bflat needs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends vice xvfb xauth binutils
      # For zero-bitcode (sdk/ZeroCSharp.Bitcode), which build.sh builds.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Set up
        working-directory: zero-csharp
        env:
          BFLAT_DIR: ${{ github.workspace }}/bflat/layouts/linux-glibc-x64
        run: ./setup.sh --c64
      - name: Test
        working-directory: zero-csharp
        env:
          BFLAT_DIR: ${{ github.workspace }}/bflat/layouts/linux-glibc-x64
        run: xvfb-run -a ./test.sh --c64

  # Cortex-M microcontrollers: the Raspberry Pi Pico 2's processor and the
  # Arduino Uno R4's, each on the QEMU board that stands in for it.
  microcontrollers:
    needs: bflat
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: zero-csharp
      - uses: actions/cache/restore@v4
        with:
          path: |
            bflat/layouts/linux-glibc-x64
            bflat/layouts/linux-glibc-arm64
          key: ${{ needs.bflat.outputs.key }}
          fail-on-cache-miss: true
      - name: Restore the Arm tools
        uses: actions/cache@v4
        with:
          path: |
            zero-csharp/tools/arm
            zero-csharp/tools/wasm
          key: arm-tools-${{ hashFiles('zero-csharp/env.sh') }}
      - name: Install QEMU and what bflat needs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-arm binutils
      # For zero-bitcode (sdk/ZeroCSharp.Bitcode), which build.sh builds.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Set up
        working-directory: zero-csharp
        env:
          BFLAT_DIR: ${{ github.workspace }}/bflat/layouts/linux-glibc-x64
        run: ./setup.sh --arm
      - name: Test the Pico 2
        working-directory: zero-csharp
        env:
          BFLAT_DIR: ${{ github.workspace }}/bflat/layouts/linux-glibc-x64
        run: ./test.sh --pico2
      - name: Test the Uno R4
        working-directory: zero-csharp
        env:
          BFLAT_DIR: ${{ github.workspace }}/bflat/layouts/linux-glibc-x64
        run: ./test.sh --r4
