# The Zero C# packages (sdk/): builds them, tests them on clean machines with
# only the .NET SDK installed, and publishes them to nuget.org on a tag
# sdk-v<version>.
#
#   bflat    the fork's layouts, cached (as in test.yml, same cache key)
#   payload  zerocore, lib/ and the link objects (./build.sh --sdk-payload)
#   trim     each host's layout, trimmed on that host (sdk/trim-layout.sh)
#   pack     the four packages (sdk/pack.sh), uploaded as the "feed" artifact
#   test     sdk/test/run.sh against the feed: Ubuntu 24.04 x64 and arm64,
#            Ubuntu 22.04, Debian 12 and Fedora in containers, the newest
#            .NET SDK, and macOS (what works there without a native step)
#   publish  on a tag sdk-v*: dotnet nuget push, by trusted publishing (below)
name: SDK

on:
  push:
    branches: [master]
    tags: ['sdk-v*']
  pull_request:
  workflow_dispatch:

# A newer push to a pull request cancels the run for the older one; runs on
# master and on tags always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The fork's branch whose bflat the packages carry. master for a release.
env:
  BFLAT_REF: master

permissions:
  contents: read
  packages: read # the fork's build restores packages from GitHub Packages

jobs:
  bflat:
    runs-on: ubuntu-22.04
    outputs:
      key: ${{ steps.fork.outputs.key }}
      commit: ${{ steps.fork.outputs.commit }}
    steps:
      - name: Find the fork's current commit
        id: fork
        run: |
          commit=$(git ls-remote https://github.com/OnurGumus/bflat "refs/heads/$BFLAT_REF" | cut -f1)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "key=bflat-layouts-$commit" >> "$GITHUB_OUTPUT"
      - name: Restore bflat from the cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            bflat/layouts/linux-glibc-x64
            bflat/layouts/linux-glibc-arm64
            bflat/layouts/windows-x64
          key: ${{ steps.fork.outputs.key }}
          lookup-only: true
      - name: Check out the fork
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: OnurGumus/bflat
          ref: ${{ env.BFLAT_REF }}
          path: bflat
      - name: Set up .NET
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build bflat
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: bflat
        env:
          PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd src/bflat
          dotnet nuget add source --username USERNAME --password "$PACKAGES_TOKEN" --store-password-in-clear-text \
            --name github "https://nuget.pkg.github.com/bflattened/index.json"
          cd ../..
          dotnet build src/bflat/bflat.csproj -t:BuildLayouts -c:Release
      - name: Save bflat to the cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            bflat/layouts/linux-glibc-x64
            bflat/layouts/linux-glibc-arm64
            bflat/layouts/windows-x64
          key: ${{ steps.fork.outputs.key }}

  payload:
    needs: bflat
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: zero-csharp
      - uses: actions/cache/restore@v4
        with:
          path: |
            bflat/layouts/linux-glibc-x64
            bflat/layouts/linux-glibc-arm64
            bflat/layouts/windows-x64
          key: ${{ needs.bflat.outputs.key }}
          fail-on-cache-miss: true
      - name: Install the assemblers and clang
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils binutils-aarch64-linux-gnu clang
      # zero-bitcode (sdk/ZeroCSharp.Bitcode), which the payload carries, and
      # fsharp/build-core.sh (the C# and F# compilers for FSharp.Core).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build the payload
        working-directory: zero-csharp
        env:
          BFLAT_DIR: ${{ github.workspace }}/bflat/layouts/linux-glibc-x64
          BFLAT_COMMIT: ${{ needs.bflat.outputs.commit }}
        run: ./build.sh --sdk-payload sdk/ZeroCSharp.Sdk/payload
      - uses: actions/upload-artifact@v4
        with:
          name: payload
          path: zero-csharp/sdk/ZeroCSharp.Sdk/payload

  trim:
    needs: [bflat, payload]
    strategy:
      matrix:
        include:
          - { rid: linux-x64, arch: x64, runner: ubuntu-24.04 }
          - { rid: linux-arm64, arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: zero-csharp
      - uses: actions/cache/restore@v4
        with:
          path: |
            bflat/layouts/linux-glibc-x64
            bflat/layouts/linux-glibc-arm64
            bflat/layouts/windows-x64
          key: ${{ needs.bflat.outputs.key }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: payload
          path: zero-csharp/sdk/ZeroCSharp.Sdk/payload
      - name: Trim the layout
        working-directory: zero-csharp
        run: sdk/trim-layout.sh ../bflat/layouts/linux-glibc-${{ matrix.arch }} sdk/trimmed/${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: trimmed-${{ matrix.rid }}
          path: zero-csharp/sdk/trimmed/${{ matrix.rid }}

  # Windows can't be traced like Linux: its list is linux-x64's, mapped.
  trim-windows:
    needs: [bflat, trim]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: zero-csharp
      - uses: actions/cache/restore@v4
        with:
          path: |
            bflat/layouts/linux-glibc-x64
            bflat/layouts/linux-glibc-arm64
            bflat/layouts/windows-x64
          key: ${{ needs.bflat.outputs.key }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: trimmed-linux-x64
          path: zero-csharp/sdk/trimmed/linux-x64
      - name: Trim the layout
        working-directory: zero-csharp
        run: sdk/trim-windows-layout.sh ../bflat/layouts/windows-x64 sdk/trimmed/linux-x64 sdk/trimmed/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: trimmed-win-x64
          path: zero-csharp/sdk/trimmed/win-x64

  # bflat can't build itself for macOS: the fork's tools/build-macos-layout.sh
  # makes the layout on a Mac (NativeAOT, Microsoft's osx-arm64 JITs, LLVM's
  # lld), from the linux-glibc-arm64 layout's lib/ and ref/.
  # The macOS layout: built on a Mac (cached), then trimmed with the
  # linux-arm64 list, mapped (otool needs a Mac). One job, so one wait for a
  # Mac runner.
  bflat-macos:
    needs: [bflat, trim]
    runs-on: macos-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - id: key
        run: echo "key=bflat-macos-layout-${{ needs.bflat.outputs.commit }}" >> "$GITHUB_OUTPUT"
      - name: Restore the macOS layout from the cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: bflat/layouts/osx-arm64
          key: ${{ steps.key.outputs.key }}
      - uses: actions/checkout@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          repository: OnurGumus/bflat
          ref: ${{ needs.bflat.outputs.commit }}
          path: bflat
      - uses: actions/cache/restore@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            bflat/layouts/linux-glibc-x64
            bflat/layouts/linux-glibc-arm64
            bflat/layouts/windows-x64
          key: ${{ needs.bflat.outputs.key }}
          fail-on-cache-miss: true
      - uses: actions/setup-dotnet@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          dotnet-version: '10.0.x'
      - name: Build the macOS layout
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bflat/tools/build-macos-layout.sh bflat/layouts/linux-glibc-arm64 bflat/layouts/osx-arm64
      - name: Save the macOS layout to the cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: bflat/layouts/osx-arm64
          key: ${{ steps.key.outputs.key }}
      - uses: actions/checkout@v4
        with:
          path: zero-csharp
      - uses: actions/download-artifact@v4
        with:
          name: trimmed-linux-arm64
          path: zero-csharp/sdk/trimmed/linux-arm64
      - name: Trim the layout
        working-directory: zero-csharp
        run: sdk/trim-macos-layout.sh ../bflat/layouts/osx-arm64 sdk/trimmed/linux-arm64 sdk/trimmed/osx-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: trimmed-osx-arm64
          path: zero-csharp/sdk/trimmed/osx-arm64
      # ZeroTarget=dotnet's native half on macOS (dotnet/native): built here,
      # on a Mac, because the payload job runs on Linux. pack adds it.
      - name: Build libzerocompat.dylib
        working-directory: zero-csharp
        run: dotnet/native/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: zerocompat-osx
          path: zero-csharp/dotnet/out/libzerocompat.dylib
          if-no-files-found: error

  pack:
    needs: [trim, trim-windows, bflat-macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # A release tag must name the version the packages get, or nothing is published.
      - name: Check the release tag
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        run: sdk/check-tag.sh "$GITHUB_REF_NAME"
      # ZeroCSharp.Dotnet(.Net) target net11.0, so the packing is done with the
      # .NET SDK 11 (the newest installed is the one dotnet runs).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: payload
          path: sdk/ZeroCSharp.Sdk/payload
      - uses: actions/download-artifact@v4
        with:
          pattern: trimmed-*
          path: sdk/trimmed
      - uses: actions/download-artifact@v4
        with:
          name: zerocompat-osx
          path: sdk/ZeroCSharp.Sdk/payload/dotnet/native/osx
      - name: Pack
        run: |
          # Without it, ZeroTarget=dotnet refuses to build on macOS (ZERO016).
          test -f sdk/ZeroCSharp.Sdk/payload/dotnet/native/osx/libzerocompat.dylib
          for d in sdk/trimmed/trimmed-*; do mv "$d" "sdk/trimmed/${d#sdk/trimmed/trimmed-}"; done
          ZERO_PAYLOAD_PREBUILT=1 sdk/pack.sh
          # F# projects on ZeroTarget=dotnet need it (pack.sh leaves it out without the .NET SDK 11).
          ls sdk/feed/ZeroCSharp.Dotnet.[0-9]*.nupkg sdk/feed/ZeroCSharp.Dotnet.Net.[0-9]*.nupkg
      - uses: actions/upload-artifact@v4
        with:
          name: feed
          path: sdk/feed

  # Runners come with a lot installed, so the containers are the clean test:
  # only the .NET SDK (dotnet-install.sh) and what the test script itself uses.
  test:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu-24.04 x64, runner: ubuntu-24.04, dotnet: '10.0.x', macbuilt: linux-x64 }
          - { name: ubuntu-24.04 arm64, runner: ubuntu-24.04-arm, dotnet: '10.0.x', macbuilt: linux-arm64 }
          - { name: newest .NET SDK, runner: ubuntu-24.04, dotnet: '11.0.x', quality: preview }
          - { name: ubuntu-22.04 container, runner: ubuntu-24.04, container: 'ubuntu:22.04' }
          - { name: debian-12 container, runner: ubuntu-24.04, container: 'debian:12' }
          - { name: fedora-41 container, runner: ubuntu-24.04, container: 'fedora:41' }
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - name: Install the test script's tools, and .NET in containers
        if: matrix.container != ''
        run: |
          if command -v dnf > /dev/null; then
            dnf install -y -q curl file binutils unzip zip findutils libicu tar gzip
          else
            apt-get update -qq && apt-get install -y -qq curl ca-certificates file binutils unzip zip libicu-dev
          fi
          curl -sSL https://dot.net/v1/dotnet-install.sh | bash -s -- --channel 10.0 --install-dir /usr/share/dotnet
          ln -s /usr/share/dotnet/dotnet /usr/local/bin/dotnet
      - uses: actions/setup-dotnet@v4
        if: matrix.container == ''
        with:
          dotnet-version: ${{ matrix.dotnet }}
          dotnet-quality: ${{ matrix.quality || 'ga' }}
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: payload
          path: sdk/ZeroCSharp.Sdk/payload
      - uses: actions/download-artifact@v4
        with:
          name: feed
          path: sdk/feed
      - name: Test
        env:
          ZERO_NO_PACK: '1'
        run: dotnet --version && sdk/test/run.sh
      # The macOS programs this machine built, for mac-programs to run.
      - uses: actions/upload-artifact@v4
        if: matrix.macbuilt != ''
        with:
          name: mac-built-${{ matrix.macbuilt }}
          path: sdk/test/work/mac-built/${{ matrix.macbuilt }}
          if-no-files-found: error

  # Git Bash, as the runner has it: the tests build and run Windows programs
  # for real, and build Linux ones.
  windows:
    needs: pack
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: payload
          path: sdk/ZeroCSharp.Sdk/payload
      - uses: actions/download-artifact@v4
        with:
          name: feed
          path: sdk/feed
      - name: Test
        env:
          ZERO_NO_PACK: '1'
        run: dotnet --version && sdk/test/run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-built-linux
          path: sdk/test/work/windows-built
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: mac-built-win-x64
          path: sdk/test/work/mac-built/win-x64
          if-no-files-found: error

  # The Linux programs and native library the Windows job built, run on Linux.
  windows-built-linux:
    needs: windows
    strategy:
      matrix:
        include:
          - { rid: linux-x64, runner: ubuntu-24.04 }
          - { rid: linux-arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: windows-built-linux
          path: built
      - name: Run the program built on Windows
        run: |
          chmod +x built/${{ matrix.rid }}/native
          out=$(built/${{ matrix.rid }}/native)
          echo "$out"
          [ "$out" = hi ]
      - name: Call the native library built on Windows
        run: sdk/test/call-native-lib.sh built/${{ matrix.rid }}/nativelib.so

  # The macOS programs and native library built on Linux and Windows
  # (sdk/test/run.sh, mac_target*, native_library_cross), run on a Mac: signed
  # ad hoc, and printing (or answering the .NET caller) what they should.
  mac-programs:
    needs: [test, windows]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          pattern: mac-built-*
          path: built
      - name: Run the programs and call the libraries built on each host
        run: |
          for host in linux-x64 linux-arm64 win-x64; do
            echo "== built on $host"
            dir=built/mac-built-$host
            chmod +x $dir/native $dir/threads
            codesign -v $dir/native $dir/threads
            out=$($dir/native); echo "$out"; [ "$out" = hi ]
            out=$($dir/threads); echo "$out"; [ "$out" = "$(printf '499500\n1')" ]
            codesign -v $dir/nativelib.dylib
            sdk/test/call-native-lib.sh $dir/nativelib.dylib
          done

  macos:
    needs: pack
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: payload
          path: sdk/ZeroCSharp.Sdk/payload
      - uses: actions/download-artifact@v4
        with:
          name: zerocompat-osx
          path: sdk/ZeroCSharp.Sdk/payload/dotnet/native/osx
      - uses: actions/download-artifact@v4
        with:
          name: feed
          path: sdk/feed
      - name: Test
        env:
          ZERO_NO_PACK: '1'
        run: dotnet --version && sdk/test/run.sh
      # ZeroTarget=dotnet needs the .NET SDK 11: its tests, with the packed
      # libzerocompat.dylib, after the rest ran on the SDK 10.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Test ZeroTarget=dotnet
        env:
          ZERO_NO_PACK: '1'
        run: dotnet --version && sdk/test/run.sh dotnet_target dotnet_net_types dotnet_fsharp
      - uses: actions/upload-artifact@v4
        with:
          name: macos-built
          path: sdk/test/work/macos-built
          if-no-files-found: error

  # The Linux and Windows programs and native libraries the macos job built,
  # run on their systems.
  macos-built:
    needs: macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, runner: ubuntu-24.04, exe: '', lib: .so }
          - { rid: linux-arm64, runner: ubuntu-24.04-arm, exe: '', lib: .so }
          - { rid: win-x64, runner: windows-latest, exe: '.exe', lib: .dll }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: macos-built
          path: built
      - name: Run the program built on a Mac
        run: |
          chmod +x built/${{ matrix.rid }}/native${{ matrix.exe }}
          out=$(built/${{ matrix.rid }}/native${{ matrix.exe }} | tr -d '\r')
          echo "$out"
          [ "$out" = hi ]
      - name: Call the native library built on a Mac
        run: sdk/test/call-native-lib.sh built/${{ matrix.rid }}/nativelib${{ matrix.lib }}

  # Trusted publishing: nuget.org trusts this workflow (a policy on the
  # package owner's account: owner OnurGumus, repository zero-csharp,
  # workflow sdk.yml), and NuGet/login trades GitHub's OIDC token for a key
  # that lives an hour. No API key is stored. vars.NUGET_USER is the
  # nuget.org user name (a repository variable, not a secret).
  publish:
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    needs: [test, windows, windows-built-linux, mac-programs, macos, macos-built]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: feed
          path: feed
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push to nuget.org
        run: dotnet nuget push "feed/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
